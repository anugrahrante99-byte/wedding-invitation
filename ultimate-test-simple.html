<!DOCTYPE html>
<html>
<head>
    <title>ULTIMATE SIMPLE TEST</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .url { background: #f0f0f0; padding: 10px; word-break: break-all; }
        .result { margin: 10px 0; padding: 10px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔥 ULTIMATE SIMPLE TEST</h1>
    
    <div class="test">
        <h3>📡 Web App URL</h3>
        <div class="url" id="webappUrl">https://script.google.com/macros/s/AKfycbzed3XIgRN11x0x5YAjgeEt2hQMLN6o0Uz84nUa_YhrTA8xHCB4TdYR4aiJyXumfOXL/exec</div>
    </div>
    
    <div class="test">
        <h3>🧪 Direct URL Tests</h3>
        <button onclick="testDirectGet()">🔍 Test Direct GET</button>
        <button onclick="testDirectPost()">📤 Test Direct POST</button>
        <button onclick="testWindowOpen()">🪟 Test Window Open</button>
        <div id="directResult" class="result"></div>
    </div>
    
    <div class="test">
        <h3>📊 Status</h3>
        <div id="status">Ready to test...</div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzTS2wdS3nAcH6mHJyFThjMbgp1W0eBnAqWW6wVdusPkfry__OobiNHJaHfmB0UUbl0/exec';
        
        function updateStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.innerHTML = `<div class="${isError ? 'error' : 'success'}">${message}</div>`;
        }
        
        function showResult(elementId, message, isError = false) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="${isError ? 'error' : 'success'}">${message}</div>`;
        }
        
        async function testDirectGet() {
            try {
                updateStatus('Testing direct GET...');
                const url = `${API_URL}?action=test&t=${Date.now()}`;
                
                // Method 1: Direct fetch
                const response = await fetch(url, {
                    method: 'GET',
                    mode: 'no-cors' // Try without CORS first
                });
                
                const text = await response.text();
                showResult('directResult', `✅ Direct GET Success:\n\n${text}`);
                updateStatus('✅ Direct GET working!');
                
            } catch (error) {
                // Method 2: Iframe
                try {
                    updateStatus('Trying iframe method...');
                    const iframe = document.createElement('iframe');
                    iframe.style.display = 'none';
                    iframe.src = `${API_URL}?action=test&t=${Date.now()}`;
                    document.body.appendChild(iframe);
                    
                    setTimeout(() => {
                        showResult('directResult', '✅ Iframe method attempted (check console for details)');
                        updateStatus('✅ Iframe method tried');
                    }, 3000);
                    
                } catch (iframeError) {
                    showResult('directResult', `❌ Both methods failed:\n\nFetch: ${error.message}\nIframe: ${iframeError.message}`, true);
                    updateStatus('❌ All methods failed', true);
                }
            }
        }
        
        async function testDirectPost() {
            try {
                updateStatus('Testing direct POST...');
                
                // Create form data
                const formData = new FormData();
                formData.append('action', 'test');
                formData.append('timestamp', new Date().toISOString());
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData
                });
                
                const text = await response.text();
                showResult('directResult', `✅ Direct POST Success:\n\n${text}`);
                updateStatus('✅ Direct POST working!');
                
            } catch (error) {
                showResult('directResult', `❌ Direct POST Error:\n\n${error.message}`, true);
                updateStatus('❌ Direct POST failed', true);
            }
        }
        
        function testWindowOpen() {
            try {
                updateStatus('Testing window open...');
                const testUrl = `${API_URL}?action=test&t=${Date.now()}`;
                
                // Open in new window
                const newWindow = window.open(testUrl, '_blank', 'width=600,height=400');
                
                if (newWindow) {
                    showResult('directResult', '✅ Window opened successfully! Check the new window for results.');
                    updateStatus('✅ Window open working!');
                    
                    // Close after 5 seconds
                    setTimeout(() => {
                        newWindow.close();
                    }, 5000);
                } else {
                    showResult('directResult', '❌ Popup blocked! Please allow popups for this site.', true);
                    updateStatus('❌ Popup blocked', true);
                }
                
            } catch (error) {
                showResult('directResult', `❌ Window open Error:\n\n${error.message}`, true);
                updateStatus('❌ Window open failed', true);
            }
        }
        
        // Auto-test on load
        window.addEventListener('load', () => {
            updateStatus('Page loaded - Ready for testing');
            console.log('Ultimate Simple Test Ready');
            console.log('API URL:', API_URL);
        });
    </script>
</body>
</html>
